# Experiment 2 method settings -- MATCHED-TFLOPs design.
# TARGET = fast-dllm's structural cost MINIMUM (nb=8, block 32):
#   268.1 TF/doc analytic (P~900, gsm8k 5-shot; model:
#   run_experiment_6_horizontal_equal_quality.flops_doc).
# ours and d2cache are tuned TO this budget; h=5 is fixed by design for ours.
#
#   ours       Kr=8, Kp=32, h=5        -> 254.0 TF (0.95x, slightly UNDER --
#              ours never exceeds the baseline budget)
#   fastdllm   nb=8 (the target itself) -> 268.1 TF (1.00x)
#   d2cache    k=8, rollout ON p=0.05   -> 284.8 TF (1.06x). Full method incl.
#              rollout fits at this budget (it did not at the old 139 TF
#              target). Exact-match alternative: k=4, p=0.05 -> 268.8 (1.00x).
#   dllmcache  cannot go below ~700 TF/doc at ANY setting (full-window
#              V-projection + LM-head floor: ~2.4 TF/step before any
#              attention row); runs at its paper-region campaign setting
#              -> 976.8 TF = 3.6x the budget, a documented compute ADVANTAGE
#              (vs dense it is still the paper-consistent 4.7x reduction).
#
# Read by run_experiment_2_dose_response.py (--methods_yaml); the 'args'
# blocks go into DiffusionConfig_Eval verbatim.

target_tflops_doc: 268.1

methods:
  ours:
    runner: run_llada_semi_mlp_v2
    num_blocks: 1
    tflops_pred: 254.0
    args:
      step_refresh_remainder: 8
      step_refresh_remainder_prompt: 32
      select_only_in_h: true
      h: 5
      path_router: routers_e2e/llada_base__cm_clean.pt

  fastdllm:
    runner: run_llada_fastdllm
    num_blocks: 8
    tflops_pred: 268.1
    args: {}

  d2cache:
    runner: run_llada_d2cache
    num_blocks: 1
    tflops_pred: 284.8
    args:
      d2c_k: 8
      d2c_sigma: 10.0
      d2c_rollout_p: 0.05
      d2c_conf_mode: live

  dllmcache:
    runner: run_llada_dllm_cache
    num_blocks: 1
    tflops_pred: 976.8
    args:
      dllmc_v_rate: 0.25
      step_refresh_remainder: 8
      step_refresh_remainder_prompt: 64
